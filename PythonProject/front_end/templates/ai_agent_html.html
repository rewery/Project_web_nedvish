<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <link rel="stylesheet" href="../assets/css/ai_agent_css.css" />
        <noscript><link rel="stylesheet" href="../assets/css/noscript.css" /></noscript>
        <title>AI</title>
    </head>
    <body>
        <div class="parent-container">

          <!-- Здесь содержимое чата -->
          <div class="messages">
            Сообщения пользователя и бота
          </div>

          <!-- Поле ввода -->
          <div class="chat-container">
            <textarea
              id="message"
              placeholder="Спросите что-нибудь..."
              rows="1"
            ></textarea>

            <button class="send" type="button" onclick="sendMessage()">
              ↑
            </button>
          </div>

        </div>

        <script src="../assets/js/ai_agent_js.js"></script>
    </body>
</html>
