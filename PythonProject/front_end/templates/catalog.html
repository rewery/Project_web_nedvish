<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h2 class="major">Каталог квартир</h2>
    <section class="catalog-container">
        <div class="catalog-header">
            <p>Все квартиры из базы данных Homer</p>
            <button type="button" id="catalog-add-button">
                Добавить квартиру
            </button>
        </div>

        <div id="catalog-status" role="status">
            Загружаем квартиры...
        </div>

        <div id="catalog-list"></div>
        <div id="catalog-form-container" hidden></div>
    </section>
</body>
</html>
