<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Homer — ИИ-помощник</title>

    <link rel="stylesheet" href="/assets/css/ai_agent_css.css">
</head>

<body>
    <div class="parent-container">

        <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            aria-label="Переключить тему"
        >
        🌙
        </button>

        <div class="messages" aria-live="polite">
        </div>

        <div class="chat-container">
            <textarea
                id="message"
                placeholder="Расскажите, какую квартиру ищете..."
                rows="1"
                aria-label="Сообщение помощнику"
            ></textarea>

            <button class="send" type="button"
                    onclick="sendMessage()"
                    aria-label="Отправить сообщение">
                ↑
            </button>
        </div>

    </div>

    <script src="/assets/js/ai_agent_js.js"></script>
</body>
</html>
